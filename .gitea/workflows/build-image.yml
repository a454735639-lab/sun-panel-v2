# ==========================================================================
# Sun-Panel-v2 · push 时自动构建 arm64 镜像并推送到 Gitea Registry
#
# 运行位置：NAS 上的 act_runner（容器 act_runner，标签 ubuntu-latest）
# 触发：push 到 main，或手动 workflow_dispatch
# 产物：192.168.3.20:3003/gitadmin/sunpanel:<version> / :latest / :sha-<short>
#
# 与 Agent2api 仓库的差异：
#   * 本仓库是**真源码项目**（Vue 前端 + Go 后端），不是发行包归档
#   * 直接用仓库自带的根 Dockerfile（多阶段：node 构建前端 → golang 编译后端 → alpine 运行）
#   * 构建耗时约 2 分钟，内存峰值约 1.2GB（实测 NAS 上可用内存从未低于 1.7GB）
#
# 关键点（都是实测踩过的坑）：
#   1. 容器内必须清空代理变量 —— NAS 的 Docker daemon 会注入 HTTP_PROXY，
#      而 busybox/wget 不认 CIDR 网段，访问内网 Gitea 会被 Clash 转走返回 502。
#   2. 基础镜像必须预先 pull —— Docker Hub 直连会走 IPv6 超时。
#      步骤 2 里逐个 pull（带重试），后面 docker build 用 --pull=false。
#   3. act_runner 不预置仓库内容，且本 Gitea 未镜像 actions/checkout，
#      所以用 git clone + REPO_READ_TOKEN 检出。
# ==========================================================================
name: build-arm64-image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: 192.168.3.20:3003
  IMAGE: 192.168.3.20:3003/gitadmin/sunpanel
  GITEA_HOST: gitea:3000
  REPO: gitadmin/Sunpanel
  # 容器内不走代理（daemon 注入的代理会让内网地址 502）
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  http_proxy: ""
  https_proxy: ""
  NO_PROXY: "*"

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 环境自检
        run: |
          set -eux
          uname -m
          docker version --format 'client={{.Client.Version}} server={{.Server.Version}}'
          git --version

      - name: 2. 检出源码
        env:
          REPO_READ_TOKEN: ${{ secrets.REPO_READ_TOKEN }}
        run: |
          set -eu
          SRC=/tmp/sp-src
          rm -rf "$SRC"
          git clone --depth 1 "http://gitadmin:${REPO_READ_TOKEN}@${GITEA_HOST}/${REPO}.git" "$SRC"
          echo "SRC=$SRC" >> "$GITHUB_ENV"
          echo "commit=$(cd "$SRC" && git rev-parse HEAD)" >> "$GITHUB_ENV"
          ls -la "$SRC" | head -20

      - name: 3. 计算版本号与 tag
        run: |
          set -eu
          cd "$SRC"
          # 版本号从 service/assets/version 读取（格式：日期|版本号）
          VERSION="$(cut -d '|' -f 2 ./service/assets/version | tr -d ' \r\n')"
          [ -n "$VERSION" ] || { echo "无法读取版本号"; exit 1; }
          SHORT="$(echo "$commit" | cut -c1-7)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$SHORT" >> "$GITHUB_ENV"
          echo "构建版本：$VERSION （commit $SHORT）"

      - name: 4. 预拉基础镜像（避免 IPv6 超时）
        run: |
          set -eu
          for img in node:20-alpine golang:1.21-alpine alpine:3.21; do
            echo "--- 拉取 $img ---"
            ok=0
            for attempt in 1 2 3; do
              if docker pull "$img"; then ok=1; break; fi
              echo "  第 $attempt 次失败，重试..."; sleep 5
            done
            [ "$ok" = 1 ] || { echo "拉取 $img 失败"; exit 1; }
          done

      - name: 5. docker build（arm64）
        run: |
          set -eu
          cd "$SRC"
          # --pull=false：用步骤 4 预拉好的本地镜像
          docker build --pull=false \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:latest" \
            -t "$IMAGE:sha-$SHORT_SHA" \
            -t "sunpanel:$VERSION" \
            .
          docker image ls --filter "reference=$IMAGE"

      - name: 6. 结构校验
        run: |
          set -eu
          docker image inspect "$IMAGE:$VERSION" --format '  arch={{.Architecture}}/{{.Os}}'
          arch="$(docker image inspect "$IMAGE:$VERSION" --format '{{.Architecture}}')"
          [ "$arch" = "arm64" ] || { echo "架构不是 arm64：$arch"; exit 1; }
          # 检查关键文件都在
          docker run --rm --entrypoint sh "$IMAGE:$VERSION" -c '
            test -x /app/sun-panel && echo "  ✓ /app/sun-panel 可执行"
            test -f /app/web/index.html && echo "  ✓ /app/web/index.html 存在"
            test -f /app/conf.example.ini && echo "  ✓ /app/conf.example.ini 存在"
            test -x /app/entrypoint.sh && echo "  ✓ /app/entrypoint.sh 可执行"
            echo "  前端文件数: $(find /app/web -type f | wc -l)"
          '

          # 构建期环境变量校验：baseURL 不得为空。
          #
          # 这条检查来自一次真实事故：.dockerignore 用 !.env 放行了 .env，
          # 但 Dockerfile 的 web-build 阶段漏了 COPY .env，导致构建时
          # VITE_GLOB_API_URL 缺失 → axios baseURL 变成空串 →
          # 请求打到 /panel/... 而不是 /api/panel/...，前端全部 404，
          # 界面只显示「网络错误」。仅检查"文件存在"抓不到这类问题
          #（文件都在、值却是错的），必须读产物里的实际值。
          #
          # 校验逻辑放在 scripts/check-baseurl.sh，而非内联在此处：
          # 内联时 shell 与 YAML 的引号转义会互相干扰（实测踩过坑），
          # 且独立脚本可在本地直接验证。
          #
          # 注意挂载路径用 $SRC 而非 $PWD：本仓库的 act_runner 不预置仓库内容、
          # 也不支持 actions/checkout，源码是 git clone 到 /tmp/sp-src（见第 2 步），
          # 当前工作目录并不是仓库根。
          echo "--- baseURL 校验 ---"
          docker run --rm --entrypoint sh \
            -v "$SRC/scripts:/scripts:ro" \
            "$IMAGE:$VERSION" -c 'sh /scripts/check-baseurl.sh /app/web' \
            || { echo "前端 baseURL 为空，请求会打到错误路径（检查 Dockerfile 是否 COPY .env）"; exit 1; }

      - name: 7. 冒烟运行（端口 3002 可连）
        run: |
          set -eu
          # 注意：本镜像是 alpine，只有 busybox sh，**不支持 /dev/tcp**（那是 bash 特性）。
          # 用容器自带的 wget 探测（镜像里已装 curl/wget/nc）。
          NAME=sp-smoke-$$
          docker run -d --name "$NAME" "$IMAGE:$VERSION" >/dev/null
          trap 'docker rm -f "$NAME" >/dev/null 2>&1 || true' EXIT
          ok=0
          for i in $(seq 1 30); do
            if docker exec "$NAME" wget -q -O /dev/null --timeout=3 http://127.0.0.1:3002/healthz 2>/dev/null; then
              echo "第 $i 次探测：3002 已就绪"
              ok=1
              break
            fi
            sleep 2
          done
          [ "$ok" = 1 ] || { echo "3002 未就绪，容器日志："; docker logs "$NAME" 2>&1 | tail -20; exit 1; }
          echo "--- HTTP 状态 ---"
          docker exec "$NAME" curl -s -o /dev/null -w 'HTTP %{http_code}\n' --max-time 3 http://127.0.0.1:3002/healthz
          echo "--- 启动日志 ---"
          docker logs "$NAME" 2>&1 | head -12 || true

      - name: 8. 推送到 Gitea Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -eu
          echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u gitadmin --password-stdin
          for t in "$VERSION" latest "sha-$SHORT_SHA"; do
            docker push "$IMAGE:$t"
          done
          docker logout "$REGISTRY" >/dev/null 2>&1 || true

      - name: 9. 从 Registry 拉回并跑起来（端到端验证）
        run: |
          set -eu
          docker rmi "$IMAGE:$VERSION" >/dev/null 2>&1 || true
          docker pull "$IMAGE:$VERSION"
          docker image inspect "$IMAGE:$VERSION" --format 'pulled={{.Architecture}}/{{.Os}}'
          NAME=sp-pull-$$
          docker run -d --name "$NAME" "$IMAGE:$VERSION" >/dev/null
          ok=0
          for i in $(seq 1 20); do
            if docker exec "$NAME" wget -q -O /dev/null --timeout=3 http://127.0.0.1:3002/healthz 2>/dev/null; then
              echo "拉回的镜像可正常启动并响应 3002"; ok=1; break
            fi
            sleep 2
          done
          docker rm -f "$NAME" >/dev/null 2>&1 || true
          [ "$ok" = 1 ]

      - name: 10. 打 git tag 并创建 Release
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -eu
          # tag 格式：v<版本号>-<commit短哈希>
          # 用短哈希保证唯一 —— 因为版本号文件可能连续多次 push 都不变，
          # 重复打同一个 tag 会失败。
          TAG="v${VERSION}-${SHORT_SHA}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "准备发布 tag：$TAG"

          cd "$SRC"

          # 该 tag 已存在则跳过（重复 push 同 commit 时）
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "tag $TAG 已存在，跳过创建 Release"
            exit 0
          fi

          # 用 API 创建 Release（会自动创建对应 tag）
          # 注意：Gitea 创建 Release 时 target_commitish 指向的 commit 若已有同名 tag 会冲突，
          #       这里 tag 带短哈希，天然唯一。
          BODY="$(cat <<EOF
          ## Sun-Panel-v2 ${VERSION}

          自动构建的 arm64 镜像（aarch64，适配 ARM NAS）。

          ### 镜像

          \`\`\`sh
          docker pull 192.168.3.20:3003/gitadmin/sunpanel:${VERSION}
          docker pull 192.168.3.20:3003/gitadmin/sunpanel:latest
          \`\`\`

          ### 运行

          \`\`\`sh
          docker run -d --name sun-panel \\
            -p 3002:3002 \\
            -v /volume1/docker/sunpanel/data:/data \\
            192.168.3.20:3003/gitadmin/sunpanel:${VERSION}
          \`\`\`

          ### 构建信息

          | 项 | 值 |
          |---|---|
          | 版本 | \`${VERSION}\` |
          | commit | \`${commit}\` |
          | 镜像 tag | \`${VERSION}\` / \`latest\` / \`sha-${SHORT_SHA}\` |
          | 架构 | linux/arm64 |

          > 本 Release 由 Gitea Actions 自动创建。
          EOF
          )"

          python3 -c "
          import json, os, urllib.request, urllib.error
          payload = {
              'tag_name': os.environ['TAG'],
              'name': 'Sun-Panel-v2 ' + os.environ['VERSION'],
              'body': '''$BODY''',
              'target_commitish': os.environ['commit'],
              'draft': False,
              'prerelease': False,
          }
          req = urllib.request.Request(
              'http://gitea:3000/api/v1/repos/gitadmin/Sunpanel/releases',
              data=json.dumps(payload).encode(),
              headers={
                  'Content-Type': 'application/json',
                  'Authorization': 'token ' + os.environ["RELEASE_TOKEN"],
              },
              method='POST')
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  d = json.load(r)
                  print('Release 创建成功:', d['tag_name'], '->', d.get('html_url', ''))
          except urllib.error.HTTPError as e:
              body = e.read().decode()
              if e.code == 409:
                  print('Release 已存在，跳过:', e.code)
              else:
                  print('创建失败:', e.code, body)
                  raise SystemExit(1)
          "