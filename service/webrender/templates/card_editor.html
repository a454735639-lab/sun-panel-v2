卡片编辑弹窗。数据：.Card .Groups .IsNew .ContainerList .DockerAvailable */}}
<div class="modal-backdrop" onclick="if(event.target===this)this.remove()">
  <div class="modal">
    <form class="modal-body"
          hx-post="/hx/card/save"
          hx-target="#group-cards-{{ .Card.ItemIconGroupId }}"
          hx-swap="outerHTML"
          hx-on::after-request="if(event.detail.successful)document.querySelector('.modal-backdrop').remove()">

      <h3 class="modal-title">{{ if .IsNew }}添加卡片{{ else }}编辑卡片{{ end }}</h3>

      <input type="hidden" name="id" value="{{ .Card.ID }}">

      <label class="field">
        <span class="field-label">名称 *</span>
        <input type="text" name="title" required autofocus value="{{ .Card.Title }}" placeholder="例如 moviepilot">
      </label>

      <div class="field-row">
        <label class="field">
          <span class="field-label">外网地址</span>
          <input type="text" name="url" value="{{ .Card.Url }}" placeholder="https://mp.example.com">
        </label>
        <label class="field">
          <span class="field-label">内网地址</span>
          <input type="text" name="lanUrl" value="{{ .Card.LanUrl }}" placeholder="http://192.168.3.20:3000">
        </label>
      </div>

      <label class="field">
        <span class="field-label">描述</span>
        <input type="text" name="description" value="{{ .Card.Description }}" placeholder="选填">
      </label>

      <label class="field">
        <span class="field-label">所属分组</span>
        <select name="itemIconGroupId">
          {{ range .Groups }}
            <option value="{{ .ID }}" {{ if eq .ID $.Card.ItemIconGroupId }}selected{{ end }}>{{ .Title }}</option>
          {{ end }}
        </select>
      </label>

      <fieldset class="field-group">
        <legend class="field-label">图标</legend>
        <label class="field" style="margin-bottom:8px">
          <span class="field-label">iconify 图标名（如 material-symbols:home）</span>
          <div class="icon-picker">
            <input type="text" id="iconify-input" placeholder="mdi:home / material-symbols:home" oninput="applyIconify(this.value)">
            <button type="button" class="btn btn--sm" onclick="applyIconify(document.getElementById('iconify-input').value)">用图标</button>
          </div>
        </label>
        <div class="hint" style="margin-bottom:8px">或填写图片地址 / 上传：</div>
        <div class="icon-picker">
          <input type="text" name="iconSrc" id="icon-src-input" value="{{ .Card.Icon.Src }}" placeholder="图标 URL 或留空用文字">
          <button type="button" class="btn btn--sm" onclick="fetchFavicon()">抓取</button>
          <button type="button" class="btn btn--sm" onclick="document.getElementById('icon-upload-input').click()">上传</button>
          <button type="button" class="btn btn--sm"
                  hx-get="/hx/icon/picker" hx-target="body" hx-swap="beforeend">选图标</button>
          <input type="file" id="icon-upload-input" accept="image/*" style="display:none" onchange="uploadIcon(this)">
        </div>
        <div class="icon-preview">
          <span class="ico ico--img" style="width:44px;height:44px;background:#2a2a2a6b">
            <img id="icon-preview-img" src="{{ .Card.Icon.Src }}" alt="" onerror="this.style.display='none'">
          </span>
          <span class="hint">留空则自动抓取 favicon</span>
        </div>
      </fieldset>

      <label class="field">
        <span class="field-label">打开方式</span>
        <select name="openMethod">
          <option value="2" {{ if eq .Card.OpenMethod 2 }}selected{{ end }}>新窗口</option>
          <option value="1" {{ if eq .Card.OpenMethod 1 }}selected{{ end }}>当前窗口</option>
        </select>
      </label>

      {{ if .DockerAvailable }}
      <fieldset class="field-group">
        <legend class="field-label">卡片类型</legend>
        <select name="cardType" id="card-type-select" onchange="toggleDockerFields()">
          <option value="0" {{ if eq .Card.CardType 0 }}selected{{ end }}>普通链接</option>
          <option value="2" {{ if eq .Card.CardType 2 }}selected{{ end }}>Docker 容器</option>
        </select>
        <div id="docker-fields" style="margin-top:8px">
          <label class="field">
            <span class="field-label">容器</span>
            <select name="containerId">
              <option value="">— 选择容器 —</option>
              {{ range .ContainerList }}
                <option value="{{ .ID }}" {{ if eq .ID $.DockerContainerID }}selected{{ end }}>{{ .Name }} ({{ .State }})</option>
              {{ end }}
            </select>
          </label>
        </div>
      </fieldset>
      {{ end }}

      <fieldset class="field-group">
        <legend class="field-label">服务状态小组件</legend>
        <label class="field">
          <span class="field-label">类型</span>
          <select name="widgetType" id="widget-type" onchange="toggleWidgetFields()">
            <option value="">无</option>
            <option value="qbittorrent" {{ if eq .Card.WidgetType "qbittorrent" }}selected{{ end }}>qBittorrent（下载/上传/做种）</option>
            <option value="transmission" {{ if eq .Card.WidgetType "transmission" }}selected{{ end }}>Transmission</option>
            <option value="emby" {{ if eq .Card.WidgetType "emby" }}selected{{ end }}>Emby（播放中/片库）</option>
            <option value="jellyfin" {{ if eq .Card.WidgetType "jellyfin" }}selected{{ end }}>Jellyfin</option>
          </select>
        </label>
        <div id="widget-fields" style="display:none">
          <label class="field">
            <span class="field-label">服务地址</span>
            <input type="text" name="widgetUrl" value="{{ .WidgetUrl }}" placeholder="http://192.168.3.20:8090">
          </label>
          <div class="field-row" id="widget-auth-row">
            <label class="field">
              <span class="field-label">用户名</span>
              <input type="text" name="widgetUsername" value="{{ .WidgetUsername }}" autocomplete="off">
            </label>
            <label class="field">
              <span class="field-label">密码</span>
              <input type="password" name="widgetPassword" value="{{ .WidgetPassword }}" autocomplete="new-password">
            </label>
          </div>
          <label class="field" id="widget-apikey-row">
            <span class="field-label">API Key（Emby/Jellyfin 必填；qB 4.6+ 可选，填了就不用账号密码）</span>
            <input type="text" name="widgetApikey" value="{{ .WidgetApikey }}" autocomplete="off">
          </label>
        </div>
      </fieldset>

      <div class="modal-actions">
        {{ if not .IsNew }}
          <button type="button" class="btn btn--danger"
                  hx-post="/hx/card/{{ .Card.ID }}/delete"
                  hx-confirm="确定删除这张卡片？"
                  hx-target="#card-{{ .Card.ID }}"
                  hx-swap="outerHTML"
                  hx-on::after-request="document.querySelector('.modal-backdrop').remove()">删除</button>
        {{ end }}
        <span class="spacer"></span>
        <button type="button" class="btn" onclick="document.querySelector('.modal-backdrop').remove()">取消</button>
        <button type="submit" class="btn btn--primary">保存</button>
      </div>
    </form>
  </div>
</div>

<script>
function toggleDockerFields() {
  var t = document.getElementById('card-type-select')
  var f = document.getElementById('docker-fields')
  if (!t || !f) return
  f.style.display = t.value === '2' ? '' : 'none'
}
function toggleWidgetFields() {
  var sel = document.getElementById('widget-type')
  var box = document.getElementById('widget-fields')
  if (!sel || !box) return
  var t = sel.value
  box.style.display = t ? '' : 'none'
  // Emby/Jellyfin 用 API Key，qB/Tr 用账号密码
  var authRow = document.getElementById('widget-auth-row')
  var keyRow = document.getElementById('widget-apikey-row')
  var useKey = (t === 'emby' || t === 'jellyfin')
  if (authRow) authRow.style.display = useKey ? 'none' : ''
  if (keyRow) keyRow.style.display = useKey ? '' : 'none'
}
document.addEventListener('DOMContentLoaded', toggleWidgetFields)
toggleWidgetFields()

function applyIconify(name) {
  name = (name || '').trim()
  if (!name) return
  var srcEl = document.getElementById('icon-src-input')
  var img = document.getElementById('icon-preview-img')
  // 用 SVG 数据 URL 渲染，避免依赖外部接口
  var url = 'https://api.iconify.design/' + name.replace(':', '/') + '.svg'
  srcEl.value = url
  img.src = url
  img.style.display = ''
}

function uploadIcon(input) {
  var f = input.files && input.files[0]
  if (!f) return
  var fd = new FormData()
  fd.append('iconfile', f)
  var img = document.getElementById('icon-preview-img')
  fetch('/hx/icon/upload', { method: 'POST', body: fd, credentials: 'same-origin' })
    .then(function (r) { return r.json() })
    .then(function (res) {
      if (res && res.code === 0 && res.data && res.data.url) {
        document.getElementById('icon-src-input').value = res.data.url
        img.src = res.data.url
        img.style.display = ''
      } else {
        alert((res && res.msg) || '上传失败')
      }
    })
    .catch(function () { alert('上传失败') })
    .finally(function () { input.value = '' })
}

function fetchFavicon() {
  var urlEl = document.querySelector('input[name=url]')
  var srcEl = document.getElementById('icon-src-input')
  var img = document.getElementById('icon-preview-img')
  var u = (urlEl && urlEl.value) || (document.querySelector('input[name=lanUrl]') || {}).value
  if (!u) { alert('请先填写地址'); return }
  var base = u.replace(/\/+$/, '')
  srcEl.value = 'https://icon.xiaoge.org/images/website/' + (function () {
    try { return new URL(u).hostname.split('.')[0] } catch (e) { return 'default' }
  })() + '.png'
  img.src = srcEl.value
  img.style.display = ''
}
document.addEventListener('DOMContentLoaded', toggleDockerFields)
toggleDockerFields()
</script>
