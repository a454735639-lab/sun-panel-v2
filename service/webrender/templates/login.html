{{ template "head" . }}

<div class="auth-wrap">
  <form class="auth-card" method="post" action="/login">
    <div class="auth-lang">
      <select name="lang" onchange="this.form.submit()">
        <option value="zh-CN" {{ if eq .Lang "zh-CN" }}selected{{ end }}>简体中文</option>
        <option value="en-US" {{ if eq .Lang "en-US" }}selected{{ end }}>English</option>
      </select>
    </div>

    <h1 class="auth-title">{{ default "Sun-Panel" .SiteTitle }}</h1>

    {{ if .Error }}<p class="auth-error">{{ .Error }}</p>{{ end }}

    <label class="field">
      <span class="field-label">账号</span>
      <input type="text" name="username" autocomplete="username" required autofocus value="{{ .Username }}">
    </label>

    <label class="field">
      <span class="field-label">密码</span>
      <input type="password" name="password" autocomplete="current-password" required>
    </label>

    {{ if .CaptchaEnabled }}
      <label class="field">
        <span class="field-label">验证码</span>
        <span class="captcha-row">
          <input type="text" name="vCode" autocomplete="off" required>
          <img id="captcha-img" src="/api/openness/getCaptcha" alt="验证码" onclick="this.src='/api/openness/getCaptcha?t='+Date.now()">
        </span>
      </label>
    {{ end }}

    <button class="btn btn--primary btn--block" type="submit">登录</button>

    <p class="auth-foot">Powered By Sun-Panel</p>
  </form>
</div>

{{ template "foot" . }}
