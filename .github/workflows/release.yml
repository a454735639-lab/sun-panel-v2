name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v heading="## v${VERSION}" '
            $0 == heading { found = 1; print; next }
            found && /^## v/ { exit }
            found { print }
          ' UPDATELOG.md > release-notes.md
          if ! test -s release-notes.md; then
            printf '%s\n' "$GITHUB_REF_NAME" > release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
