name: Build & Publish Docker Image

# 构建并推送多架构镜像到 GHCR。
# NAS（aarch64）用 docker compose pull 即可，无需在 NAS 上编译。
#
# 相比旧版的改动：
#   1. 移除 Set up QEMU —— Dockerfile 已改为 BUILDPLATFORM 原生交叉编译，
#      构建阶段不再执行任何目标架构二进制，因此 QEMU 不再需要。
#      这是 arm64 构建耗时下降的主要原因。
#   2. 增加 sbom / provenance，便于镜像供应链追溯。
#   3. 增加构建后自检：确认镜像内不含 web/ 目录，且 embed 静态资源可正常提供。

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 不再需要 QEMU：Dockerfile 用 BUILDPLATFORM 原生交叉编译
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

      # 自检：镜像应同时提供 SSR 与 Vue 两套前端
      #
      # 说明：本步骤原先断言"镜像内不应有 /app/web"——那是纯 SSR 时期的约束。
      # 现在 Vue 前端恢复并挂载在 /v2/，产物就应存在于 /app/web，
      # 故断言方向反转：必须有 /app/web，且 /v2/ 能正常返回入口页。
      - name: Verify image (web present, both frontends reachable)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -e
          TAG="$(echo "$TAGS" | head -1)"
          echo "检查镜像: $TAG"
          docker pull --platform linux/amd64 "$TAG"
          echo "--- /app 内容 ---"
          docker run --rm --entrypoint sh "$TAG" -c 'ls -la /app'

          # Vue 产物必须存在，且入口页与 assets 齐全
          if ! docker run --rm --entrypoint sh "$TAG" -c 'test -f /app/web/index.html'; then
            echo "::error::镜像缺少 /app/web/index.html（Vue 前端产物未打包）"
            exit 1
          fi
          echo "自检通过：/app/web 存在"

          docker run -d --name sp-check -p 13002:3002 "$TAG"
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:13002/healthz >/dev/null 2>&1; then break; fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:13002/healthz && echo "healthz OK"

          # SSR 侧：embed 的静态资源仍可访问
          curl -fsS http://127.0.0.1:13002/static/htmx.min.js >/dev/null && echo "embed static OK"
          curl -fsS -o /dev/null http://127.0.0.1:13002/login && echo "SSR /login OK"

          # Vue 侧：入口页与 assets 均可访问
          curl -fsS -o /dev/null http://127.0.0.1:13002/v2/ && echo "Vue /v2/ OK"
          V2JS="$(curl -fsS http://127.0.0.1:13002/v2/ | grep -oE '/v2/assets/index-[^"]*\.js' | head -1)"
          if [ -z "$V2JS" ]; then
            echo "::error::/v2/ 入口页中未找到 assets 引用"
            exit 1
          fi
          curl -fsS -o /dev/null "http://127.0.0.1:13002$V2JS" && echo "Vue asset OK ($V2JS)"

          curl -s -o /dev/null -w "docker endpoint: %{http_code}\n" -X POST \
            -H "Content-Type: application/json" -d '{"containerIds":["x"]}' \
            http://127.0.0.1:13002/api/docker/container/getContainerStates
          docker logs sp-check | tail -20 || true
          docker rm -f sp-check